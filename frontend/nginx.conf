server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # 建置檔名含雜湊可長期快取；頁面、Service Worker 與 manifest 每次向主機確認。
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; try_files $uri $uri/ /index.html; }
  location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /ws/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; proxy_set_header Host $host; }
  location /docs { proxy_pass http://backend:8000; }
  location /openapi.json { proxy_pass http://backend:8000; }
}
